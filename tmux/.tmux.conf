# Core settings and keymaps
source-file ~/.config/tmux/options.conf
source-file ~/.config/tmux/keymaps.conf

# Plugin declarations and options (sourced directly for TPM discovery)
source-file ~/.config/tmux/plugins.conf

# Theme: enable only one (status bar, pane borders, and SessionX).
# source-file ~/.config/tmux/solarized.conf
source-file ~/.config/tmux/nordbones.conf

source-file ~/.config/tmux/utility.conf

# Initialize TPM after the rest of the configuration.
run '~/.tmux/plugins/tpm/tpm'

# Apply the theme directly; this SessionX version does not pass its fzf options through.
bind-key o run-shell 'FZF_DEFAULT_OPTS="$(tmux show-option -gqv @sessionx-fzf-flags)" FZF_DEFAULT_OPTS_FILE= "${TMUX_PLUGIN_MANAGER_PATH%/}/tmux-sessionx/scripts/sessionx.sh"'
