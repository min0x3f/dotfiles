# Solarized Light
set -g status-position bottom
set -g status-left-length 100
set -g status-style 'fg=#657b83,bg=default'
set -g status-left '#[fg=#{?client_prefix,#cb4b16,#859900},bold] #S #[fg=#93a1a1,nobold] | '
set -g status-right ' #{cpu}   #{mem} '

set -g window-status-current-format '#[fg=#268bd2,bold]  #[underscore]#I:#W#[nounderscore]#{?window_zoomed_flag, 󰍋 ,}'
set -g window-status-format '#[fg=#93a1a1] #I:#W'
set -g message-style 'fg=#657b83,bg=#eee8d5'
set -g mode-style 'fg=#657b83,bg=#eee8d5'
set -g pane-border-style 'fg=#eee8d5'
set -g pane-active-border-style 'fg=#268bd2'

# SessionX popup
set -g @sessionx-fzf-flags '--color=bg:#fdf6e3,bg+:#eee8d5,fg:#586e75,fg+:#073642,header:#268bd2,info:#657b83,prompt:#657b83,pointer:#268bd2,marker:#268bd2,spinner:#859900,hl:#cb4b16,hl+:#cb4b16,preview-bg:#fdf6e3,preview-fg:#586e75'
