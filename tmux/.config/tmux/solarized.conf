# ==========================================
# SOLARIZED DARK (TRUNCATED PATH & GORP SESSION)
# ==========================================
# Nền chung: Base04 (#002b36), Chữ Base0 (#839496)
set -g status-style 'bg=#002b36,fg=#839496'
set -g status-position bottom

# --- Status Left (Session Name & Username) ---
# Logic mới:
# 1. Session (#S): Nền Trắng (#fdf6e3) -> Đỏ (#dc322f) khi Prefix
# 2. Username: Nền Bạc (#93a1a1) cố định, KHÔNG thay đổi theo Prefix
set -g status-left-length 50
set -g status-left "#[fg=#002b36,bg=#{?client_prefix,#B7211F,#EEE8D5},bold] #S #[fg=#{?client_prefix,#dc322f,#ffffff},bg=#657b83,nobold]#[fg=#002b36,bg=#657b83] #(whoami) #[fg=#93a1a1,bg=#002b36]"

# 1. Inactive Tab (Tab ẩn)
#set -g window-status-format "#[fg=#002b36,bg=#073642,nobold]#[fg=#93a1a1,bg=#073642] #I #[fg=#073642,bg=#002b36,nobold]#[fg=#586e75,bg=#002b36] #$TRUNCATED_PATH "
setw -g window-status-format '#[fg=#003b36,bg=#002b36]#[default] #I  #{b:pane_current_path} #[fg=#002b36,bg=#002b36,nobold,nounderscore,noitalics]'

setw -g window-status-current-format '#[fg=#002b36,bg=#EEE8D5]#[fg=#b58900,bg=#eee8d5] #I #[fg=#ffffff,bg=#B58900] #{b:pane_current_path} #[fg=#FFC100,bg=#002b36,nobold]'
setw -g window-status-separator ""

# --- Status Right ---
set -g status-right-length 150
set -g status-right "#[fg=#586e75,bg=#002b36] #[fg=#93a1a1,bg=#586e75]  #h #[fg=#93a1a1,bg=#586e75] #[fg=#002b36,bg=#93a1a1]  #[fg=#002b36,bg=#93a1a1,bold]%H:%M #[fg=#93a1a1,bg=#002b36]"

set -g status-interval 1
