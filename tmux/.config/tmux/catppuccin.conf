# ==========================================
# CATPPUCCIN THEME (CUSTOM BG: #181825)
# ==========================================
# Status bar chung: Nền #181825, chữ Text (#cdd6f4)
set -g status-style 'bg=#181825,fg=#cdd6f4'
set -g status-position bottom

# --- Status Left (Session Name) ---
# Logic: Green (#a6e3a1) (bình thường) -> Red (#f38ba8) (khi nhấn Prefix)
set -g status-left-length 50
# Chú ý: Arrow cuối cùng đổi bg thành #181825
set -g status-left "#[fg=#1e1e2e,bold,bg=#{?client_prefix,#f38ba8,#a6e3a1}]  #S #[fg=#{?client_prefix,#f38ba8,#a6e3a1},bg=#181825,nobold]"

# --- Window Status (Danh sách các tab) ---
# Format cho window không active: Nền #181825
set -g window-status-format "#[fg=#45475a,bg=#181825] #I: #W "

# Format cho window đang active: Nền Mauve (#cba6f7)
# Chú ý: Arrow cuối cùng đổi bg thành #181825
set -g window-status-current-format "#[fg=#1e1e2e,bg=#cba6f7]#[fg=#1e1e2e,bg=#cba6f7,bold] #I:  #W #[fg=#cba6f7,bg=#181825,nobold]"
set -g window-status-separator ""

# --- Status Right (Hostname, Time) ---
# Hostname: Nền Surface0 (#45475a)
# Time: Nền Green (#a6e3a1)
set -g status-right-length 150
# Chú ý: Arrow đầu tiên đổi bg thành #181825
set -g status-right "#[fg=#45475a,bg=#181825] #[fg=#cdd6f4,bg=#45475a]  #h #[fg=#a6e3a1,bg=#45475a]#[fg=#1e1e2e,bg=#a6e3a1,bold]  %H:%M "

set -g status-interval 1
