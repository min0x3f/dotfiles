# Style (Solarized Light)
gray_light="#fdf6e3"
gray_medium="#93a1a1"
gray_dark="#657b83"
green_soft="#859900"
prefix_active="#cb4b16"
blue_muted="#eee8d5"
cyan_soft="#268bd2"

set -g status-position bottom
set -g status-left-length 100
set -g status-style "fg=${gray_dark},bg=default"
set -g status-left "#[fg=#{?client_prefix,#cb4b16,#859900},bold] #S #[fg=#93a1a1,nobold] | "
set -g status-right " #{cpu}   #{mem} "

set -g window-status-current-format "#[fg=${cyan_soft},bold]  #[underscore]#I:#W#[nounderscore]#{?window_zoomed_flag, 󰍋 ,}"
set -g window-status-format "#[fg=${gray_medium}] #I:#W"
set -g message-style "fg=${gray_dark},bg=${blue_muted}"
set -g mode-style "fg=${gray_dark},bg=${blue_muted}"
set -g pane-border-style "fg=${blue_muted}"
set -g pane-active-border-style "fg=${cyan_soft}"
