# Plugin manager and defaults
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Navigate between Neovim splits and tmux panes.
set -g @plugin 'christoomey/vim-tmux-navigator'

# Save layouts and pane contents.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents "on"
# Auto-restore requires Continuum, which is not enabled.
set -g @continuum-restore "on"

# Switch sessions and windows with prefix + o.
set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 'o'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-window-mode 'on'
set -g @sessionx-bat 'bat'

# Status bar widgets
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'hendrikmi/tmux-cpu-mem-monitor'

# Optional theme
# set -g @plugin 'catppuccin/tmux'
