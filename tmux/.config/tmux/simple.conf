set -g status-style bg=default,fg=colour244

set -g window-status-format "#[fg=colour240,bg=default] #I #{b:pane_current_path} "
set -g window-status-current-format "#[fg=white,bg=default,bold] // #I #{b:pane_current_path} "

set -g status-right "#[fg=colour239]#[fg=colour244] %H:%M #[fg=colour239] #[fg=colour248]%d/%m #[fg=colour239] #[fg=colour250]#H "
set -g status-right-length 300

set -g status-left "#[fg=colour248,bold] #S #[fg=colour239]|| "

set -g pane-border-style fg=colour235
set -g pane-active-border-style fg=colour240
