# Nordbones (dark)
set -g status-position bottom
set -g status-left-length 100
set -g status-style 'fg=#a5b4cd,bg=default'
set -g status-left '#[fg=#{?client_prefix,#cf866f,#a4be8d},bold] #S #[fg=#a5b4cd,nobold] | '
set -g status-right ' #{cpu}   #{mem} '

set -g window-status-current-format '#[fg=#87bfce,bold]  #[underscore]#I:#W#[nounderscore]#{?window_zoomed_flag, 󰍋 ,}'
set -g window-status-format '#[fg=#a5b4cd] #I:#W'
set -g message-style 'fg=#ebeef3,bg=#545f70'
set -g mode-style 'fg=#ebeef3,bg=#545f70'
set -g pane-border-style 'fg=#475063'
set -g pane-active-border-style 'fg=#87bfce'

# SessionX popup
set -g @sessionx-fzf-flags '--color=bg:#2f3541,bg+:#545f70,fg:#ebeef3,fg+:#ebeef3,header:#a5b4cd,info:#8fbcba,prompt:#87bfce,pointer:#89cac8,marker:#a4be8d,spinner:#b38dac,hl:#87bfce,hl+:#82cce0,preview-bg:#2f3541,preview-fg:#ebeef3'
